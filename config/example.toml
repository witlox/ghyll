# Ghyll configuration
# Copy to ~/.ghyll/config.toml and edit endpoints

[models.m25]
endpoint = "https://inference.internal:8001/v1"
dialect = "minimax"
max_context = 1000000
# api_key = ""  # optional Bearer token; override via GHYLL_API_KEY_M25 or GHYLL_API_KEY

[models.glm5]
endpoint = "https://inference.internal:8002/v1"
dialect = "glm"
max_context = 200000
# api_key = ""  # optional Bearer token; override via GHYLL_API_KEY_GLM5 or GHYLL_API_KEY

# Kimi 2.5 / 2.6 family. The `dialect` field is the lowercase
# routing key (one of: minimax, glm, deepseek, qwen, kimi).
# The optional `model` field is the literal id sent on the OpenAI
# request body's `model` field — set this to the canonical
# mixed-case id so a CSCS-style gateway routes to the right backend.
# When `model` is omitted the dialect string falls back as the wire
# `model` field (legacy behaviour preserved for the other dialects).
# [models.kimi-k26-cscs]
# endpoint = "https://ai-gateway.svc.cscs.ch/v1"
# dialect = "kimi"
# model = "moonshotai/Kimi-K2.6"
# max_context = 200000
# api_key = "sk-..."  # CSCS Bearer token; override via GHYLL_API_KEY_KIMI_K26_CSCS

[routing]
default_model = "m25"
deep_model = "glm5"
context_depth_threshold = 32000
tool_depth_threshold = 5
enable_auto_routing = true
# v2 gate-floor escalation: when a v2 gate declares MinTier at or above
# this DepthRank (0=NONE, 1=SHALLOW, 2=MOCKED, 3=REALISTIC), routing
# pins to deep_model and de-escalation is blocked. Default 2 (MOCKED).
# gate_floor_escalate_at_rank = 2

[memory]
branch = "ghyll/memory"
auto_sync = true
sync_interval_seconds = 60
checkpoint_interval_turns = 5
drift_check_interval_turns = 5
drift_threshold = 0.7

[memory.embedder]
model_url = "https://huggingface.co/nicholasgasior/gte-micro-onnx/resolve/main/model.onnx"
# model_sha256 is optional. When set, `ghyll memory fetch-embedder`
# verifies the downloaded hash before installing. The default URL
# is SHA-256 pinned in the binary; set your own hash only when you
# override model_url.
# model_sha256 = "45b71fe98efe5f530b825dce6f5049d738e9c16869f10be4370ab81a9912d4a6"
model_path = "~/.ghyll/models/gte-micro.onnx"
dimensions = 384

[tools]
bash_timeout_seconds = 30
file_timeout_seconds = 5
prefer_ripgrep = true
# web_timeout_seconds = 30          # timeout for web_fetch/web_search
# web_max_response_tokens = 10000   # cap on web_fetch payload (truncation marker appended)
# web_search_backend = "duckduckgo" # search backend (currently only duckduckgo)

# Sub-agent budgets (the `agent` tool the model dispatches for focused sub-tasks).
# [sub_agent]
# default_model = "m25"       # model name; defaults to routing.default_model
# max_turns = 20              # cap on the sub-agent turn-loop iterations
# token_budget = 50000        # total token cap across the sub-agent run
# timeout_seconds = 300       # wall-clock timeout for the entire sub-agent

# Workflow instruction loading (project + global instructions, roles, commands).
# [workflow]
# instruction_budget_tokens = 2000   # cap on instructions+role in the system prompt
# fallback_folders = [".claude"]     # folders to consult if .ghyll/ is absent

# Optional: team memory search server
# [vault]
# url = "https://vault.internal:9090"
# token = "team-shared-secret"
