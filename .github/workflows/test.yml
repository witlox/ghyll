name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Compute test package set
        id: pkgs
        run: |
          # Mirror Makefile's `coverage` target: all packages except
          # the godog BDD suite (which is exercised separately below).
          PKGS=$(go list ./... | grep -v tests/acceptance | tr '\n' ' ')
          echo "list=${PKGS}" >> "$GITHUB_OUTPUT"

      - name: Run unit + session tests with coverage
        run: |
          # -coverpkg=./... so a test in package X exercising code in
          # package Y still credits Y. Mirrors the Makefile coverage
          # target. 240s timeout for the slowest packages (cmd/ghyll,
          # engine, runner under -race).
          go test -v -race -count=1 -timeout=240s \
            -coverprofile=coverage.txt -coverpkg=./... \
            ${{ steps.pkgs.outputs.list }}
          go tool cover -func=coverage.txt | tail -1

      - name: Run acceptance tests
        run: |
          go test -v -count=1 ./tests/acceptance/...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.txt
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          # CI floor is loose (50%) so a transient gap doesn't block
          # merges; the Makefile's `coverage-check` target enforces the
          # tighter 78% Tier-3 floor locally and pre-PR.
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 50% threshold"
            exit 1
          fi
